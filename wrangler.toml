# Cloudflare Pages config (used by `wrangler pages dev` / `wrangler pages deploy`).
# NOTE: when this file is present, Cloudflare treats it as the source of truth for bindings and the
# dashboard binding settings become read-only. Replace the all-zero KV id below with your real namespace id (see GO-LIVE.md).
name = "jacobs-consultancy"
pages_build_output_dir = "public"
compatibility_date = "2026-05-01"

[ai]
binding = "AI"

[[kv_namespaces]]
binding = "CHAT_KV"
id = "13df1df678cf4e938af7a8b3b9ad1d63"

[vars]
CHAT_PER_MIN = "10"
CHAT_PER_DAY = "40"
CHAT_DAILY_CAP = "500"
MAIL_FROM = "Jacobs Consultancy <website@thejacobsconsultancy.com>"
MAIL_TO = "info@thejacobsconsultancy.com"
